<style>
  :root {
    color-scheme: dark;
    --bg: #0d0d12;
    --surface: #17171f;
    --surface2: #1c1c26;
    --border: #2a2a35;
    --text: #e8e6f0;
    --muted: #8b8797;
    --faint: #5c5866;
    --faintest: #3f3d47;
    --accent: #e2001a;
    --accent2: #0a0a0c;
    --onaccent: #ffffff;
    --accent-glow: rgba(226,0,26,0.4);
    --accent-pink: #e2001a;
    --ink: #0a0a0c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    height: 100%;
    overscroll-behavior: none;
    transition: background 0.2s ease, color 0.2s ease;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---- Brand strip ---- */
  .brand-strip {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 16px 7px 14px;
    background: var(--accent);
    clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%);
    width: fit-content;
    margin: 10px 0 0 0;
  }
  .brand-text {
    color: var(--onaccent); font-weight: 900; font-style: italic;
    letter-spacing: 0.06em; font-size: 12px; text-transform: uppercase;
    transform: skewX(-6deg);
  }
  .brand-strip .brand-dot { width: 7px; height: 7px; background: var(--onaccent); transform: rotate(45deg); }

  .stripe-divider {
    height: 5px; margin-top: 10px;
    background: repeating-linear-gradient(-55deg, var(--accent) 0 10px, var(--accent2) 10px 20px);
    background-size: 200% 100%;
    animation: stripeSlide 2.6s linear infinite;
    flex-shrink: 0;
  }
  @keyframes stripeSlide { from { background-position: 0 0; } to { background-position: -56px 0; } }

  /* ---- Header ---- */
  header { flex-shrink: 0; padding: 0 16px 10px; }
  .header-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .space-switch {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 2px solid var(--border);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    padding: 10px 14px; flex: 1;
    color: var(--text); font-size: 15px; font-weight: 800;
    -webkit-appearance: none; appearance: none; min-width: 0;
    letter-spacing: 0.01em;
  }
  .space-switch span#spaceLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 10px; height: 10px; flex-shrink: 0; transform: rotate(45deg); }
  .space-switch .chev { margin-left: auto; color: var(--accent); font-size: 13px; font-weight: 900; }
  .theme-btn {
    flex-shrink: 0; width: 52px; height: 52px;
    background: var(--ink); border: 2px solid var(--accent);
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: var(--text);
    transition: transform 0.12s ease;
  }
  .theme-btn:active { transform: scale(0.92); }
  .tbtn-icon { font-size: 16px; line-height: 1; }
  .tbtn-label { font-size: 8px; font-weight: 800; letter-spacing: 0.02em; color: #fff; text-transform: uppercase; }

  .cat-scroll { display: flex; gap: 10px; overflow-x: auto; margin-top: 12px; padding: 2px 2px 4px; scrollbar-width: none; }
  .cat-scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    background: var(--surface); border: 2px solid var(--border);
    color: var(--muted); font-size: 12px; font-weight: 800; white-space: nowrap;
    transform: skewX(-10deg); letter-spacing: 0.02em;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .chip:active { transform: skewX(-10deg) scale(0.92); }
  .chip > * { display: inline-flex; transform: skewX(10deg); }
  .chip.active { background: var(--accent); color: var(--onaccent); border-color: var(--accent); }
  .chip .cdot { width: 7px; height: 7px; flex-shrink: 0; }
  .chip.add { color: var(--faint); border-style: dashed; }
  .chip.ghost { color: var(--muted); border-style: dashed; }

  .search-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 2px solid var(--border);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    padding: 10px 13px; margin-top: 10px;
  }
  .search-row input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 15px; font-weight: 600; min-width: 0; }
  .search-row input::placeholder { color: var(--faint); font-weight: 500; }
  .search-row svg { flex-shrink: 0; color: var(--accent); }
  .search-row .mini-btn { flex-shrink: 0; background: none; border: none; color: var(--faint); font-size: 15px; padding: 2px 4px; }
  .search-row .mini-btn.on { color: var(--accent-pink); }

  .tool-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .sort-btn {
    flex-shrink: 0; display: flex; align-items: center; gap: 5px;
    background: var(--surface); border: 2px solid var(--border);
    color: var(--muted); font-size: 11px; font-weight: 800;
    padding: 6px 11px; transform: skewX(-10deg);
  }
  .sort-btn span { display: inline-flex; transform: skewX(10deg); }

  /* ---- List ---- */
  #list { flex: 1; overflow-y: auto; padding: 12px 16px 110px; -webkit-overflow-scrolling: touch; }
  .empty { text-align: center; color: var(--faint); font-size: 14px; margin-top: 50px; padding: 0 20px; line-height: 1.6; font-weight: 600; }
  .empty .cta-btn {
    margin: 16px auto 0; display: block;
    background: var(--accent); color: var(--onaccent); font-weight: 900;
    font-size: 13px; padding: 11px 20px; border: none;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .card-wrap { position: relative; margin-bottom: 12px; overflow: hidden; }
  .card-swipe-actions {
    position: absolute; top: 0; right: 0; bottom: 0; width: 64px;
    display: flex; align-items: stretch;
  }
  .card-swipe-actions button {
    width: 64px; border: none; background: var(--accent); color: var(--onaccent);
    font-size: 20px; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--surface); border: 2px solid var(--border); border-left: 5px solid var(--accent);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    padding: 14px 14px 12px 13px; position: relative;
    opacity: 0; animation: cardIn 0.32s ease-out forwards;
    touch-action: pan-y;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
  .card.selectable { padding-left: 40px; }
  .select-badge {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; border: 2px solid var(--border); background: var(--bg);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: var(--onaccent);
  }
  .card-wrap.selected .card { border-color: var(--accent); }
  .card-wrap.selected .select-badge { background: var(--accent); border-color: var(--accent); }
  .card-space-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 800; color: var(--muted);
    margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .card-space-tag .dot { width: 6px; height: 6px; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-title-row { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
  .card-title-row .dot { width: 8px; height: 8px; }
  .card-cats { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
  .card-title { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  mark.hl { background: var(--accent); color: var(--onaccent); padding: 0 2px; border-radius: 2px; }
  .pin-btn { flex-shrink: 0; padding: 4px; color: var(--faint); background: none; border: none; transition: transform 0.15s ease; }
  .pin-btn.pinned { color: var(--accent-pink); }
  .pin-btn.pop { animation: pinPop 0.38s ease; }
  @keyframes pinPop { 0% { transform: scale(1); } 45% { transform: scale(1.45) rotate(-12deg); } 100% { transform: scale(1); } }
  .card-body {
    font-size: 13px; color: var(--muted); margin-top: 7px; white-space: pre-wrap; line-height: 1.5; font-weight: 500;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-date { margin-top: 9px; font-size: 10px; color: var(--faint); font-family: ui-monospace, monospace; font-weight: 700; letter-spacing: 0.04em; }

  /* ---- FAB ---- */
  .fab {
    position: fixed;
    right: calc(24px + env(safe-area-inset-right));
    bottom: calc(26px + env(safe-area-inset-bottom));
    width: 58px; height: 58px;
    background: var(--accent); color: var(--onaccent);
    border: 3px solid var(--ink);
    transform: rotate(45deg);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 0 var(--ink), 0 8px 20px var(--accent-glow);
    transition: transform 0.12s ease;
  }
  .fab::after {
    content: ''; position: absolute; inset: 0; border: 3px solid var(--accent);
    opacity: 0; pointer-events: none;
  }
  .fab.pulse::after { animation: fabPing 0.5s ease-out; }
  @keyframes fabPing { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.9); opacity: 0; } }
  .fab svg { transform: rotate(-45deg); }
  .fab:active { transform: rotate(45deg) scale(0.9); }

  /* ---- Select bar ---- */
  .select-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: var(--ink); border-top: 3px solid var(--accent);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 12px;
    transform: translateY(100%); transition: transform 0.22s cubic-bezier(.22,1,.36,1);
  }
  .select-bar.show { transform: translateY(0); }
  .select-bar button { background: none; border: none; color: #fff; font-size: 14px; font-weight: 800; }
  .select-bar .sb-count { color: #fff; font-size: 13px; font-weight: 800; flex: 1; }
  .select-bar .sb-actions { display: flex; gap: 16px; }

  /* ---- Toast ---- */
  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: #fff; border: 2px solid var(--accent);
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
    padding: 9px 18px; font-size: 12px; font-weight: 800; letter-spacing: 0.02em;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.32s cubic-bezier(.34,1.56,.64,1);
    z-index: 80; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button { background: none; border: none; color: var(--accent-pink); font-weight: 900; text-decoration: underline; padding: 0; margin-left: 10px; font-size: 12px; }

  #flashOverlay { position: fixed; inset: 0; z-index: 200; pointer-events: none; opacity: 0; }
  #flashOverlay.flash { animation: flashFade 0.4s ease-out; }
  @keyframes flashFade { from { opacity: 0.55; } to { opacity: 0; } }

  /* ---- Sheets / modals ---- */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: flex-end; z-index: 50;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.22s ease, visibility 0s linear 0.22s;
  }
  .sheet-backdrop.open { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.22s ease; }
  .sheet-backdrop .sheet { transform: translateY(24px); transition: transform 0.26s cubic-bezier(.22,1,.36,1); }
  .sheet-backdrop.open .sheet { transform: translateY(0); }
  .sheet {
    background: var(--surface); border-top: 4px solid var(--accent);
    clip-path: polygon(0 14px, 6% 0, 100% 0, 100% 100%, 0 100%);
    width: 100%; max-height: 88dvh; display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
    padding-top: 6px;
  }
  .sheet-handle { width: 40px; height: 4px; background: var(--faintest); margin: 10px auto 4px; }
  .sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 2px solid var(--border); color: var(--text);
  }
  .sheet-header strong { font-weight: 900; text-transform: uppercase; letter-spacing: 0.03em; font-size: 14px !important; }
  .icon-btn { background: none; border: none; color: var(--muted); padding: 6px; display: flex; transition: transform 0.12s ease; }
  .icon-btn:active { transform: scale(0.85); }
  .icon-btn.danger:active { color: var(--accent); }
  .icon-btn.pinned { color: var(--accent-pink); }
  .icon-btn[hidden] { display: none; }
  .sheet-body { padding: 16px; overflow-y: auto; flex: 1; }
  .sheet-note { font-size: 12px; color: var(--faint); line-height: 1.6; margin: 0 0 14px; font-weight: 500; }
  .title-input { width: 100%; background: transparent; border: none; outline: none; color: var(--text); font-size: 19px; font-weight: 800; margin-bottom: 10px; }
  .title-input::placeholder { color: var(--faint); }
  .content-input { width: 100%; background: transparent; border: none; outline: none; color: var(--muted); font-size: 15px; line-height: 1.6; resize: none; min-height: 26vh; font-weight: 500; }
  .content-input::placeholder { color: var(--faint); }
  .field-label { font-size: 11px; color: var(--accent); margin: 16px 0 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; }
  .list-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); border: 2px solid var(--border);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    padding: 12px; margin-bottom: 9px;
  }
  .list-row .dot { width: 9px; height: 9px; }
  .list-row span.name { flex: 1; font-size: 14px; color: var(--text); font-weight: 700; }
  .row-arrows { display: flex; flex-direction: column; gap: 2px; }
  .row-arrows button { background: none; border: none; color: var(--faint); font-size: 11px; padding: 1px 4px; line-height: 1; }
  .row-arrows button:disabled { opacity: 0.25; }
  .name-input {
    width: 100%; background: var(--bg); border: 2px solid var(--border); color: var(--text);
    padding: 12px; font-size: 15px; outline: none; margin-top: 10px; font-weight: 600;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  .name-input::placeholder { color: var(--faint); }
  .palette { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .swatch {
    width: 30px; height: 30px; border: 2px solid transparent;
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px);
    display: flex; align-items: center; justify-content: center;
  }
  .swatch.selected { border-color: var(--text); }
  .primary-btn {
    width: 100%; background: var(--accent); color: var(--onaccent); font-weight: 900;
    font-size: 15px; padding: 14px; border: none; margin-top: 14px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
    text-transform: uppercase; letter-spacing: 0.05em;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .primary-btn:active { filter: brightness(0.85); transform: scale(0.98); }
  .ghost-btn {
    background: var(--surface2); color: var(--text); border: 2px solid var(--border);
    clip-path: polygon(0 0,100% 0,100% 100%,0 100%);
  }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .primary-btn { margin-top: 0; flex: 1; }
  .footer-actions { padding: 14px 16px; border-top: 2px solid var(--border); }
  .theme-section-title { font-size: 11px; color: var(--accent); margin: 6px 0 10px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 900; }
  .theme-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 22px; }
  .theme-swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; padding: 0; }
  .theme-preview {
    width: 44px; height: 44px; border: 2px solid var(--border);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    position: relative; overflow: hidden;
  }
  .theme-preview.selected { border-color: var(--accent); border-width: 3px; }
  .theme-preview .half { position: absolute; top: 0; bottom: 0; width: 50%; }
  .theme-preview .half.l { left: 0; }
  .theme-preview .half.r { right: 0; }
  .theme-label { font-size: 9px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
  .slot-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 2px solid var(--border);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    padding: 12px; margin-bottom: 9px;
  }
  .slot-info { flex: 1; min-width: 0; }
  .slot-name { font-size: 14px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-meta { font-size: 11px; color: var(--faint); margin-top: 2px; font-weight: 600; }
  .slot-actions { display: flex; gap: 2px; flex-shrink: 0; }
</style>
</head>
<body>
<div id="app">
  <div class="brand-strip"><span class="brand-dot"></span><span class="brand-text">Memo Rack</span></div>
  <header>
    <div class="header-row">
      <button class="space-switch" id="spaceSwitchBtn">
        <span class="dot" id="spaceDot"></span>
        <span id="spaceLabel">—</span>
        <span class="chev">▾</span>
      </button>
      <button class="theme-btn" id="themeBtn" aria-label="テーマ"><span class="tbtn-icon">🎨</span><span class="tbtn-label">テーマ</span></button>
      <button class="theme-btn" id="saveLoadBtn" aria-label="セーブ・ロード"><span class="tbtn-icon">💾</span><span class="tbtn-label">セーブ</span></button>
    </div>
    <div class="cat-scroll" id="catScroll"></div>
    <div class="search-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="検索..." />
      <button class="mini-btn" id="globalSearchBtn" title="全大枠を検索">🌐</button>
    </div>
    <div class="tool-row">
      <button class="sort-btn" id="sortBtn"><span id="sortLabel">並び順: 更新日時</span></button>
    </div>
  </header>
  <div class="stripe-divider"></div>
  <div id="list"></div>
  <button class="fab" id="fabBtn" aria-label="新規メモ">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <div class="select-bar" id="selectBar">
    <button id="selectCancelBtn">✕</button>
    <span class="sb-count" id="selectCount">0件選択中</span>
    <div class="sb-actions">
      <button id="selectPinBtn">📌 ピン</button>
      <button id="selectDeleteBtn">🗑 削除</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div id="flashOverlay"></div>
</div>

<div class="sheet-backdrop" id="confirmBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><strong id="confirmTitle">確認</strong></div>
    <div class="sheet-body">
      <p id="confirmMessage" style="font-size:14px;line-height:1.7;color:var(--text);font-weight:600;white-space:pre-wrap;"></p>
      <div class="btn-row">
        <button class="primary-btn ghost-btn" id="confirmCancelBtn">キャンセル</button>
        <button class="primary-btn" id="confirmOkBtn">削除</button>
      </div>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="themeBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><strong>背景テーマ</strong><button class="icon-btn" id="closeThemePicker">✕</button></div>
    <div class="sheet-body">
      <button type="button" class="chip" id="autoModeToggle" style="margin-bottom:16px;"><span id="autoModeLabel">🔗 端末設定に自動追従：OFF</span></button>
      <div class="theme-section-title">Accent Color</div>
      <div class="theme-grid" id="accentGrid" style="grid-template-columns:repeat(5, 1fr);"></div>
      <div class="theme-section-title">Light Mode</div>
      <div class="theme-grid" id="lightThemeGrid"></div>
      <div class="theme-section-title">Dark Mode</div>
      <div class="theme-grid" id="darkThemeGrid"></div>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="saveLoadBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><strong>セーブ / ロード</strong><button class="icon-btn" id="closeSaveLoad">✕</button></div>
    <div class="sheet-body">
      <p class="sheet-note">入力内容は常に自動保存されています。ここでは、それとは別に今の状態を名前を付けて保存し、あとから呼び出す（切り替える）ことができます。</p>
      <div class="theme-section-title">セーブデータ</div>
      <div id="slotList"></div>
      <input class="name-input" id="newSlotName" placeholder="セーブ名（例：8月版）" />
      <button class="primary-btn" id="saveSlotBtn">現在の状態を保存</button>

      <div class="theme-section-title" style="margin-top:26px;">バックアップ（端末外に保存）</div>
      <p class="sheet-note">機種変更やデータ消失に備えて、ファイルとして書き出し・読み込みができます。</p>
      <div class="btn-row">
        <button class="primary-btn ghost-btn" id="exportBtn">書き出す</button>
        <button class="primary-btn ghost-btn" id="importBtn">読み込む</button>
      </div>
      <input type="file" id="importFileInput" accept="application/json" style="display:none">
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="spacePickerBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><strong>大枠を選択</strong><button class="icon-btn" id="closeSpacePicker">✕</button></div>
    <div class="sheet-body" id="spacePickerList"></div>
    <div class="footer-actions">
      <button class="primary-btn ghost-btn" id="editSpacesBtn">大枠を編集</button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="editorBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <strong>メモ</strong>
      <div style="display:flex;gap:2px;">
        <button class="icon-btn" id="dupBtn" title="複製" hidden>📄</button>
        <button class="icon-btn" id="pinBtn">📌</button>
        <button class="icon-btn danger" id="deleteBtn">🗑</button>
        <button class="icon-btn" id="closeEditor">✕</button>
      </div>
    </div>
    <div class="sheet-body">
      <input class="title-input" id="titleInput" placeholder="タイトル" />
      <textarea class="content-input" id="contentInput" placeholder="内容を入力..."></textarea>
      <div class="field-label">大枠</div>
      <div class="cat-scroll" id="editorSpaceChips" style="margin-top:0;"></div>
      <div class="field-label">カテゴリ（複数選択可）</div>
      <div class="cat-scroll" id="editorCatChips" style="margin-top:0;"></div>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="catEditorBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><strong id="catEditorTitle">カテゴリを編集</strong><button class="icon-btn" id="closeCatEditor">✕</button></div>
    <div class="sheet-body">
      <div id="catEditorList"></div>
      <input class="name-input" id="newCatName" placeholder="新しいカテゴリ名" />
      <div class="palette" id="newCatPalette"></div>
      <button class="primary-btn" id="addCatBtn">追加</button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="spaceEditorBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><strong>大枠を編集</strong><button class="icon-btn" id="closeSpaceEditor">✕</button></div>
    <div class="sheet-body">
      <div id="spaceEditorList"></div>
      <input class="name-input" id="newSpaceName" placeholder="新しい大枠名（例：仕事）" />
      <div class="palette" id="newSpacePalette"></div>
      <button class="primary-btn" id="addSpaceBtn">追加</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const PALETTE = ['#e2001a','#f2a65a','#5ecbb0','#6fa8dc','#e0c14c','#c07be0','#7fce6b','#4fe0ff'];
  const STORAGE_KEY = 'memo-rack-data-v1';
  const SLOTS_KEY = 'memo-rack-slots-v1';
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  const ACCENTS = [
    { id:'red',  name:'レッド', accent:'#e2001a', accent2:'#0a0a0c', onaccent:'#ffffff', glow:'rgba(226,0,26,0.4)' },
    { id:'blue', name:'ブルー', accent:'#0d5fe0', accent2:'#4fe0ff', onaccent:'#ffffff', glow:'rgba(13,95,224,0.45)' },
    { id:'yellow', name:'イエロー', accent:'#f4c400', accent2:'#fde98a', onaccent:'#1a1408', pink:'#ff5fa8', glow:'rgba(244,196,0,0.45)' },
  ];

  const THEMES = [
    { id:'dark-void',   mode:'dark',  name:'Void',      bg:'#0d0d12', surface:'#17171f', surface2:'#1c1c26', border:'#2a2a35', text:'#e8e6f0', muted:'#8b8797', faint:'#5c5866', faintest:'#3f3d47' },
    { id:'dark-navy',   mode:'dark',  name:'Navy',      bg:'#0a0f1a', surface:'#121a29', surface2:'#182234', border:'#22304a', text:'#e6ecf5', muted:'#7f8ba3', faint:'#54607a', faintest:'#38415a' },
    { id:'dark-forest', mode:'dark',  name:'Forest',    bg:'#0c1310', surface:'#141d18', surface2:'#1a2620', border:'#243830', text:'#e3ede7', muted:'#7fa090', faint:'#526b5f', faintest:'#39493f' },
    { id:'dark-wine',   mode:'dark',  name:'Wine',      bg:'#140b10', surface:'#1e131b', surface2:'#281a24', border:'#3a2230', text:'#f0e4ea', muted:'#a6849a', faint:'#6e5566', faintest:'#473642' },
    { id:'dark-slate',  mode:'dark',  name:'Slate',     bg:'#101113', surface:'#1a1c1f', surface2:'#22252a', border:'#2f3237', text:'#e9eaec', muted:'#8f939a', faint:'#5f636b', faintest:'#3d4046' },
    { id:'light-paper', mode:'light', name:'Paper',     bg:'#f7f5f1', surface:'#ffffff', surface2:'#efe9df', border:'#e4ded3', text:'#2b2822', muted:'#726c60', faint:'#a29c8e', faintest:'#c9c2b3' },
    { id:'light-cool',  mode:'light', name:'Cool',      bg:'#f3f5f8', surface:'#ffffff', surface2:'#e7ecf2', border:'#dde3ea', text:'#232a33', muted:'#6b7684', faint:'#9aa4b0', faintest:'#c5cdd6' },
    { id:'light-mint',  mode:'light', name:'Mint',      bg:'#f1f7f4', surface:'#ffffff', surface2:'#e3f0e9', border:'#dbeae2', text:'#20302a', muted:'#5f7d70', faint:'#8fa99c', faintest:'#bdd2c8' },
    { id:'light-lav',   mode:'light', name:'Lavender',  bg:'#f6f3fa', surface:'#ffffff', surface2:'#ece3f5', border:'#e5dcf1', text:'#2c2438', muted:'#71667e', faint:'#a191ae', faintest:'#cabcd6' },
    { id:'light-sand',  mode:'light', name:'Sand',      bg:'#faf4ec', surface:'#ffffff', surface2:'#f2e6d3', border:'#ecdcc4', text:'#332a1e', muted:'#7d6c55', faint:'#ab967b', faintest:'#d3c1a3' },
  ];

  let data = {
    theme: 'dark-void',
    accent: 'red',
    autoMode: false,
    lightThemeId: 'light-paper',
    darkThemeId: 'dark-void',
    uiState: { lastSpace: 'daily', lastCat: 'all' },
    spaces: [
      { id:'daily', name:'日常', color:'#f2a65a' },
      { id:'study', name:'勉強', color:'#6fa8dc' },
      { id:'music', name:'音楽', color:'#e2001a' },
    ],
    categories: [
      { id:'idea', name:'アイデア', color:PALETTE[0], spaceId:'daily' },
      { id:'todo', name:'TODO', color:PALETTE[1], spaceId:'daily' },
      { id:'note', name:'ノート', color:PALETTE[2], spaceId:'study' },
      { id:'ref', name:'参考', color:PALETTE[3], spaceId:'study' },
      { id:'onsource', name:'音源', color:PALETTE[4], spaceId:'music' },
      { id:'idea-m', name:'アイデア', color:PALETTE[5], spaceId:'music' },
    ],
    memos: [],
  };

  let state = {
    activeSpace: 'daily',
    activeCat: 'all',
    query: '',
    globalSearch: false,
    sortMode: 'updated',
    draft: null,
    newCatColor: PALETTE[0],
    newSpaceColor: PALETTE[0],
    selectMode: false,
    selectedIds: new Set(),
  };

  let toastTimer = null;
  function showToast(msg){
    const el = document.getElementById('toast');
    el.innerHTML = '';
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
  }
  function showUndoToast(msg, onUndo){
    const el = document.getElementById('toast');
    clearTimeout(toastTimer);
    el.innerHTML = '';
    const span = document.createElement('span');
    span.textContent = msg;
    const btn = document.createElement('button');
    btn.textContent = '元に戻す';
    btn.addEventListener('click', () => {
      onUndo();
      el.classList.remove('show');
      clearTimeout(toastTimer);
    }, { once:true });
    el.appendChild(span);
    el.appendChild(btn);
    el.classList.add('show');
    toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
  }

  function flashScreen(color){
    const el = document.getElementById('flashOverlay');
    el.style.background = color;
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  }

  // ---------- Custom confirm modal ----------
  function showConfirm(message, okLabel, onConfirm){
    document.getElementById('confirmMessage').textContent = message;
    const okBtn = document.getElementById('confirmOkBtn');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    okBtn.textContent = okLabel || '削除';
    openSheet('confirmBackdrop');
    function cleanup(){
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
    }
    function onOk(){ cleanup(); closeSheet('confirmBackdrop'); onConfirm(); }
    function onCancel(){ cleanup(); closeSheet('confirmBackdrop'); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  }

  function migrateMemos(){
    (data.memos || []).forEach(m => {
      if (!Array.isArray(m.categories)) {
        m.categories = m.category ? [m.category] : [];
      }
      delete m.category;
    });
  }

  function persistUiState(){
    data.uiState = { lastSpace: state.activeSpace, lastCat: state.activeCat };
  }

  function goToSpace(spaceId, catId){
    state.activeSpace = spaceId;
    state.activeCat = catId || 'all';
    state.globalSearch = false;
    persistUiState();
    save();
  }

  function load(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.theme) data.theme = parsed.theme;
        if (parsed.accent) data.accent = parsed.accent;
        if (typeof parsed.autoMode === 'boolean') data.autoMode = parsed.autoMode;
        if (parsed.lightThemeId) data.lightThemeId = parsed.lightThemeId;
        if (parsed.darkThemeId) data.darkThemeId = parsed.darkThemeId;
        if (parsed.uiState) data.uiState = parsed.uiState;
        if (parsed.spaces && parsed.spaces.length) data.spaces = parsed.spaces;
        if (parsed.categories) data.categories = parsed.categories;
        if (parsed.memos) data.memos = parsed.memos;
      }
    } catch(e) {}
    migrateMemos();
    const uiSpace = data.uiState && spaceById(data.uiState.lastSpace) ? data.uiState.lastSpace : (data.spaces[0] ? data.spaces[0].id : null);
    state.activeSpace = uiSpace;
    state.activeCat = (data.uiState && data.uiState.lastCat) || 'all';
  }
  function save(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e) {
      showToast('⚠️ 保存に失敗しました');
    }
  }

  function computeEffectiveThemeId(){
    if (!data.autoMode) return data.theme;
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    return prefersDark ? (data.darkThemeId || 'dark-void') : (data.lightThemeId || 'light-paper');
  }

  function applyTheme(id){
    const t = THEMES.find(x => x.id === id) || THEMES[0];
    const root = document.documentElement.style;
    root.setProperty('color-scheme', t.mode === 'light' ? 'light' : 'dark');
    root.setProperty('--bg', t.bg);
    root.setProperty('--surface', t.surface);
    root.setProperty('--surface2', t.surface2);
    root.setProperty('--border', t.border);
    root.setProperty('--text', t.text);
    root.setProperty('--muted', t.muted);
    root.setProperty('--faint', t.faint);
    root.setProperty('--faintest', t.faintest);
    document.getElementById('themeColorMeta').setAttribute('content', t.bg);
    data.theme = t.id;
  }

  function applyAccent(id){
    const a = ACCENTS.find(x => x.id === id) || ACCENTS[0];
    const root = document.documentElement.style;
    root.setProperty('--accent', a.accent);
    root.setProperty('--accent2', a.accent2);
    root.setProperty('--onaccent', a.onaccent);
    root.setProperty('--accent-glow', a.glow);
    root.setProperty('--accent-pink', a.pink || a.accent);
    data.accent = a.id;
  }

  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => {
      if (data.autoMode) {
        applyTheme(computeEffectiveThemeId());
        renderThemeSheet();
      }
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  function spaceById(id){ return data.spaces.find(s => s.id === id); }
  function catById(id){ return data.categories.find(c => c.id === id); }
  function spaceCategories(spaceId){ return data.categories.filter(c => c.spaceId === (spaceId || state.activeSpace)); }
  function spaceMemos(){ return data.memos.filter(m => m.spaceId === state.activeSpace); }

  function sortList(list){
    return list.slice().sort((a,b) => {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      if (state.sortMode === 'created') return b.createdAt - a.createdAt;
      if (state.sortMode === 'title') return (a.title||'').localeCompare(b.title||'', 'ja');
      return b.updatedAt - a.updatedAt;
    });
  }

  function filteredMemos(){
    let list = state.globalSearch ? data.memos.slice() : spaceMemos();
    if (!state.globalSearch && state.activeCat !== 'all') {
      list = list.filter(m => (m.categories||[]).includes(state.activeCat));
    }
    if (state.query.trim()) {
      const q = state.query.trim().toLowerCase();
      list = list.filter(m => m.title.toLowerCase().includes(q) || m.content.toLowerCase().includes(q));
    }
    return sortList(list);
  }

  function esc(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function highlightText(text, query){
    const escaped = esc(text);
    const q = (query||'').trim();
    if (!q) return escaped;
    const escapedQuery = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try {
      const re = new RegExp('(' + escapedQuery + ')', 'ig');
      return escaped.replace(re, '<mark class="hl">$1</mark>');
    } catch(e) { return escaped; }
  }
  function fmtDate(ts){
    const d = new Date(ts);
    return (d.getMonth()+1) + '月' + d.getDate() + '日';
  }
  function fmtDateTime(ts){
    const d = new Date(ts);
    const h = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return (d.getMonth()+1) + '/' + d.getDate() + ' ' + h + ':' + mi;
  }

  const SORT_LABELS = { updated:'更新日時', created:'作成日', title:'タイトル' };
  function cycleSort(){
    const order = ['updated','created','title'];
    const idx = order.indexOf(state.sortMode);
    state.sortMode = order[(idx+1) % order.length];
    document.getElementById('sortLabel').textContent = '並び順: ' + SORT_LABELS[state.sortMode];
    renderList();
  }

  // ---------- Selection mode ----------
  function enterSelectMode(firstId){
    state.selectMode = true;
    state.selectedIds = new Set(firstId ? [firstId] : []);
    document.getElementById('fabBtn').style.display = 'none';
    renderList();
    updateSelectBar();
  }
  function exitSelectMode(){
    state.selectMode = false;
    state.selectedIds = new Set();
    document.getElementById('fabBtn').style.display = 'flex';
    document.getElementById('selectBar').classList.remove('show');
    renderList();
  }
  function toggleSelect(id){
    if (state.selectedIds.has(id)) state.selectedIds.delete(id);
    else state.selectedIds.add(id);
    if (state.selectedIds.size === 0) { exitSelectMode(); return; }
    renderList();
    updateSelectBar();
  }
  function updateSelectBar(){
    const bar = document.getElementById('selectBar');
    document.getElementById('selectCount').textContent = state.selectedIds.size + '件選択中';
    bar.classList.toggle('show', state.selectMode && state.selectedIds.size > 0);
  }

  // ---------- Render ----------
  function renderHeader(){
    const sp = spaceById(state.activeSpace);
    document.getElementById('spaceDot').style.background = sp ? sp.color : 'var(--faint)';
    document.getElementById('spaceLabel').textContent = sp ? sp.name : '大枠がありません';

    const catScroll = document.getElementById('catScroll');
    document.getElementById('globalSearchBtn').classList.toggle('on', state.globalSearch);

    if (state.globalSearch) {
      catScroll.innerHTML = `<button class="chip ghost" data-action="exit-global"><span>✕ 全大枠を検索中</span></button>`;
      catScroll.querySelector('[data-action="exit-global"]').addEventListener('click', () => {
        state.globalSearch = false; renderAll();
      });
      return;
    }

    const cats = spaceCategories();
    let html = `<button class="chip ${state.activeCat==='all'?'active':''}" data-cat="all"><span>すべて</span></button>`;
    cats.forEach(c => {
      html += `<button class="chip ${state.activeCat===c.id?'active':''}" data-cat="${c.id}"><span class="cdot" style="background:${c.color}"></span><span>${esc(c.name)}</span></button>`;
    });
    html += `<button class="chip add" data-action="edit-cats"><span>＋ カテゴリ</span></button>`;
    catScroll.innerHTML = html;
    catScroll.querySelectorAll('[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => { state.activeCat = btn.dataset.cat; persistUiState(); save(); renderAll(); });
    });
    catScroll.querySelector('[data-action="edit-cats"]').addEventListener('click', openCatEditor);
  }

  function renderList(){
    const list = document.getElementById('list');
    const cats = state.globalSearch ? [1] : spaceCategories();
    const memos = filteredMemos();

    if (!data.spaces.length) {
      list.innerHTML = `<div class="empty">大枠がありません。まずは大枠を作成してください。<button class="cta-btn" id="ctaAddSpace">＋ 大枠を追加</button></div>`;
      document.getElementById('ctaAddSpace').addEventListener('click', openSpaceEditor);
      return;
    }

      const titleHtml = q ? highlightText(titleText, q) : esc(titleText);
      const bodyHtml = m.content ? (q ? highlightText(m.content, q) : esc(m.content)) : '';
      const selected = state.selectedIds.has(m.id);
      return `<div class="card-wrap ${selected?'selected':''}" data-wrap="${m.id}">
        ${!state.selectMode ? `<div class="card-swipe-actions"><button data-swipedel="${m.id}">🗑</button></div>` : ''}
        <div class="card ${state.selectMode?'selectable':''}" data-id="${m.id}" style="border-left-color:${primary ? primary.color : 'var(--accent)'};animation-delay:${delay}ms">
          ${state.selectMode ? `<div class="select-badge">${selected?'✓':''}</div>` : ''}
          ${sp ? `<div class="card-space-tag"><span class="dot" style="background:${sp.color}"></span>${esc(sp.name)}</div>` : ''}
          <div class="card-top">
            <div class="card-title-row">
              <div class="card-cats">${catDots}${extra}</div>
              <span class="card-title">${titleHtml}</span>
            </div>
            ${!state.selectMode ? `<button class="pin-btn ${m.pinned?'pinned':''}" data-pin="${m.id}">${m.pinned ? '📌' : '📍'}</button>` : ''}
          </div>
          ${bodyHtml ? `<div class="card-body">${bodyHtml}</div>` : ''}
          <div class="card-date">${fmtDate(m.updatedAt)}</div>
        </div>
      </div>`;
    }).join('');

    list.querySelectorAll('.card-wrap').forEach(wrap => {
      const id = wrap.dataset.wrap;
      const card = wrap.querySelector('.card');
      attachCardGestures(wrap, card, id);
    });
    list.querySelectorAll('[data-pin]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const m = data.memos.find(x => x.id === btn.dataset.pin);
        if (m) {
          m.pinned = !m.pinned;
          save();
          btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
          setTimeout(renderList, 260);
        }
      });
    });
    list.querySelectorAll('[data-swipedel]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        instantDeleteMemo(btn.dataset.swipedel);
      });

  function instantDeleteMemo(id){
    const removed = data.memos.find(m => m.id === id);
    if (!removed) return;
    data.memos = data.memos.filter(m => m.id !== id);
    save();
    renderAll();
    showUndoToast('削除しました', () => {
      data.memos.push(removed);
      save();
      renderAll();
    });

  // ---------- Card touch: tap / swipe / long-press ----------
  function attachCardGestures(wrap, card, id){
    let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, horizontal = false;
    let openSwipe = false;
    let longPressTimer = null;
    let longPressFired = false;

    function clearLP(){ clearTimeout(longPressTimer); longPressTimer = null; }

    card.addEventListener('touchstart', (e) => {
      if (state.selectMode) return;
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY; dx = 0; dragging = true; decided = false; horizontal = false;
      longPressFired = false;
      card.style.transition = 'none';
      longPressTimer = setTimeout(() => {
        longPressFired = true;
        if (navigator.vibrate) navigator.vibrate(12);
        enterSelectMode(id);
      }, 550);
    }, { passive: true });

    card.addEventListener('touchmove', (e) => {
      if (state.selectMode || !dragging) return;
      const t = e.touches[0];
      const ndx = t.clientX - startX;
      const ndy = t.clientY - startY;
      if (!decided) {
        if (Math.abs(ndx) > 6 || Math.abs(ndy) > 6) {
          decided = true;
          horizontal = Math.abs(ndx) > Math.abs(ndy);
          if (horizontal || Math.abs(ndy) > 6) clearLP();
        } else return;
      }
      if (!horizontal) return;
      dx = ndx;
      const base = openSwipe ? -64 : 0;
      const pos = Math.min(0, Math.max(-64, base + dx));
      card.style.transform = `translateX(${pos}px)`;
    }, { passive: true });

    function onTouchEnd(){
      clearLP();
      if (!dragging) return;
      dragging = false;
      card.style.transition = 'transform 0.2s ease';
      if (horizontal) {
        const base = openSwipe ? -64 : 0;
        const pos = Math.min(0, Math.max(-64, base + dx));
        openSwipe = pos < -32;
        card.style.transform = openSwipe ? 'translateX(-64px)' : 'translateX(0)';
      }
    }
    card.addEventListener('touchend', onTouchEnd);
    card.addEventListener('touchcancel', onTouchEnd);

    card.addEventListener('click', () => {
      if (longPressFired) { longPressFired = false; return; }
      if (horizontal && Math.abs(dx) > 6) return;
      if (state.selectMode) { toggleSelect(id); return; }
      const m = data.memos.find(x => x.id === id);
      if (state.globalSearch && m) {
        state.globalSearch = false;
        goToSpace(m.spaceId, 'all');
      }
      openEditor(id);
    });
  }

  function saveDraftAndClose(){
    const title = document.getElementById('titleInput').value.trim();
    const content = document.getElementById('contentInput').value.trim();
    if (!title && !content) { closeSheet('editorBackdrop'); return; }
    const now = Date.now();
    if (state.draft.id) {
      const m = data.memos.find(x => x.id === state.draft.id);
      Object.assign(m, {
        title: document.getElementById('titleInput').value,
        content: document.getElementById('contentInput').value,
        categories: state.draft.categories.slice(),
        spaceId: state.draft.spaceId,
        pinned: state.draft.pinned,
        updatedAt: now,
      });
    } else {
      data.memos.push({
        id: uid(),
        title: document.getElementById('titleInput').value,
        content: document.getElementById('contentInput').value,
        categories: state.draft.categories.slice(),
        spaceId: state.draft.spaceId,
        pinned: state.draft.pinned,
        createdAt: now,
        updatedAt: now,
      });
    }
    save();
    showToast('保存しました');
    closeSheet('editorBackdrop');
    if (state.draft.spaceId !== state.activeSpace) {
      goToSpace(state.draft.spaceId, 'all');
    }
    renderAll();
  }

  function deleteDraft(){
    if (!state.draft.id) { closeSheet('editorBackdrop'); return; }
    const id = state.draft.id;
    closeSheet('editorBackdrop');
    instantDeleteMemo(id);
  }

  function duplicateDraft(){
    if (!state.draft.id) return;
    const original = data.memos.find(m => m.id === state.draft.id);
    if (!original) return;
    const now = Date.now();
    const copy = {
      id: uid(),
      title: original.title ? original.title + ' のコピー' : '',
      content: original.content || '',
      categories: (original.categories||[]).slice(),
      spaceId: original.spaceId,
      pinned: false,
      createdAt: now,
      updatedAt: now,
    };
    data.memos.push(copy);
    save();
    showToast('複製しました');
    closeSheet('editorBackdrop');
    renderAll();
    setTimeout(() => openEditor(copy.id), 260);

    el.querySelectorAll('[data-catdown]').forEach(btn => btn.addEventListener('click', () => { moveCategory(btn.dataset.catdown, 1); }));
  }
  function moveCategory(id, dir){
    const subset = spaceCategories();
    const pos = subset.findIndex(c => c.id === id);
    const swapPos = pos + dir;
    if (pos === -1 || swapPos < 0 || swapPos >= subset.length) return;
    const neighborId = subset[swapPos].id;
    const iA = data.categories.findIndex(c => c.id === id);
    const iB = data.categories.findIndex(c => c.id === neighborId);
    [data.categories[iA], data.categories[iB]] = [data.categories[iB], data.categories[iA]];
    save();
    renderCatEditorList();
    renderHeader();
  }

  // ---------- Save / Load slots ----------
  function loadSlots(){
    try {
      const raw = localStorage.getItem(SLOTS_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return [];
  }
  function saveSlots(slots){
    try {
      localStorage.setItem(SLOTS_KEY, JSON.stringify(slots));
    } catch(e) {
      showToast('⚠️ 保存に失敗しました');
    }
  }
  function memoCountOf(d){ return (d.memos || []).length; }

  function renderSlotList(){
    const el = document.getElementById('slotList');
    const slots = loadSlots();
    if (!slots.length) {
      el.innerHTML = `<div style="color:var(--faint);font-size:13px;padding:6px 0 14px;">まだセーブデータがありません</div>`;
      return;
    }
    el.innerHTML = slots.slice().sort((a,b)=>b.savedAt-a.savedAt).map(s => `
      <div class="slot-row" data-slotrow="${s.id}">
        <div class="slot-info">
          <div class="slot-name">${esc(s.name)}</div>
          <div class="slot-meta">${fmtDateTime(s.savedAt)} ・ ${memoCountOf(s.data)}件</div>
        </div>
        <div class="slot-actions">
          <button class="icon-btn" data-loadslot="${s.id}" title="呼び出す">📥</button>
          <button class="icon-btn" data-overwriteslot="${s.id}" title="上書き保存">💾</button>
          <button class="icon-btn danger" data-delslot="${s.id}" title="削除">🗑</button>
        </div>
      </div>`).join('');

    el.querySelectorAll('[data-loadslot]').forEach(btn => {
      btn.addEventListener('click', () => {
        const slot = loadSlots().find(s => s.id === btn.dataset.loadslot);
        if (!slot) return;
        showConfirm(`「${slot.name}」を呼び出します。現在の内容は上書きされます。`, '呼び出す', () => {
          data = JSON.parse(JSON.stringify(slot.data));
          migrateMemos();
          const uiSpace = data.uiState && spaceById(data.uiState.lastSpace) ? data.uiState.lastSpace : (data.spaces[0] ? data.spaces[0].id : null);
          state.activeSpace = uiSpace;
          state.activeCat = (data.uiState && data.uiState.lastCat) || 'all';
          state.globalSearch = false;
          applyTheme(computeEffectiveThemeId());
          applyAccent(data.accent);
          save();
          showToast('呼び出しました');
          closeSheet('saveLoadBackdrop');
          renderAll();
        });
      });
    });
    el.querySelectorAll('[data-overwriteslot]').forEach(btn => {
      btn.addEventListener('click', () => {
        const slots = loadSlots();
        const slot = slots.find(s => s.id === btn.dataset.overwriteslot);
        if (!slot) return;
        showConfirm(`「${slot.name}」を現在の内容で上書き保存しますか？`, '上書き保存', () => {
          slot.data = JSON.parse(JSON.stringify(data));
          slot.savedAt = Date.now();
          saveSlots(slots);
          showToast('上書き保存しました');
          renderSlotList();
        });
      });
    });
    el.querySelectorAll('[data-delslot]').forEach(btn => {
      btn.addEventListener('click', () => {
        const slots = loadSlots();
        const slot = slots.find(s => s.id === btn.dataset.delslot);
        if (!slot) return;
        showConfirm(`「${slot.name}」を削除しますか？`, '削除', () => {
          saveSlots(slots.filter(s => s.id !== slot.id));
          showToast('セーブデータを削除しました');
          renderSlotList();
        });
      });
    });
  }

  function saveCurrentAsSlot(){
    const input = document.getElementById('newSlotName');
    const name = input.value.trim();
    if (!name) return;
    const slots = loadSlots();
    slots.push({ id: uid(), name, savedAt: Date.now(), data: JSON.parse(JSON.stringify(data)) });
    saveSlots(slots);
    showToast('セーブしました');
    input.value = '';
    renderSlotList();
  }

  function openSaveLoad(){ renderSlotList(); openSheet('saveLoadBackdrop'); }

  // ---------- Backup export / import ----------
  function exportData(){
    const payload = JSON.stringify(data, null, 2);
    const filename = 'memo-rack-backup-' + new Date().toISOString().slice(0,10) + '.json';
    const blob = new Blob([payload], { type: 'application/json' });
    if (navigator.canShare && navigator.share) {
      try {
        const file = new File([blob], filename, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: 'Memo Rack Backup' }).catch(() => {});
          return;
        }
      } catch(e) {}
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showToast('書き出しました');
  }

  function importDataFromFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch(e) {
        showToast('⚠️ 読み込みに失敗しました');
        return;
      }
      if (!parsed || !Array.isArray(parsed.spaces)) {
        showToast('⚠️ 形式が正しくありません');
        return;
      }
      showConfirm('バックアップを読み込みます。現在の内容は上書きされます。', '読み込む', () => {
        data = parsed;
        migrateMemos();
        if (typeof data.autoMode !== 'boolean') data.autoMode = false;
        data.lightThemeId = data.lightThemeId || 'light-paper';
        data.darkThemeId = data.darkThemeId || 'dark-void';
        const uiSpace = data.uiState && spaceById(data.uiState.lastSpace) ? data.uiState.lastSpace : (data.spaces[0] ? data.spaces[0].id : null);
        state.activeSpace = uiSpace;
        state.activeCat = (data.uiState && data.uiState.lastCat) || 'all';
        state.globalSearch = false;
        applyTheme(computeEffectiveThemeId());
        applyAccent(data.accent || 'red');
        save();
        showToast('読み込みました');
        closeSheet('saveLoadBackdrop');
        renderAll();
      });
    };
    reader.readAsText(file);
  }

  // ---------- Sheet helpers ----------
  function openSheet(id){ document.getElementById(id).classList.add('open'); }
  function closeSheet(id){ document.getElementById(id).classList.remove('open'); }

  // ---------- Wire up ----------
  document.getElementById('themeBtn').addEventListener('click', openThemePicker);
  document.getElementById('closeThemePicker').addEventListener('click', () => closeSheet('themeBackdrop'));
  document.getElementById('themeBackdrop').addEventListener('click', (e) => { if (e.target.id==='themeBackdrop') closeSheet('themeBackdrop'); });
  document.getElementById('autoModeToggle').addEventListener('click', () => {
    data.autoMode = !data.autoMode;
    if (data.autoMode) applyTheme(computeEffectiveThemeId());
    save();
    renderThemeSheet();
  });

  document.getElementById('saveLoadBtn').addEventListener('click', openSaveLoad);
  document.getElementById('closeSaveLoad').addEventListener('click', () => closeSheet('saveLoadBackdrop'));
  document.getElementById('saveLoadBackdrop').addEventListener('click', (e) => { if (e.target.id==='saveLoadBackdrop') closeSheet('saveLoadBackdrop'); });
  document.getElementById('saveSlotBtn').addEventListener('click', saveCurrentAsSlot);
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFileInput').click());
  document.getElementById('importFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) importDataFromFile(file);
    e.target.value = '';
  });

  document.getElementById('spaceSwitchBtn').addEventListener('click', openSpacePicker);
  document.getElementById('closeSpacePicker').addEventListener('click', () => closeSheet('spacePickerBackdrop'));
  document.getElementById('spacePickerBackdrop').addEventListener('click', (e) => { if (e.target.id==='spacePickerBackdrop') closeSheet('spacePickerBackdrop'); });
  document.getElementById('editSpacesBtn').addEventListener('click', () => { closeSheet('spacePickerBackdrop'); openSpaceEditor(); });

  document.getElementById('fabBtn').addEventListener('click', (e) => {
    e.currentTarget.classList.remove('pulse');
    void e.currentTarget.offsetWidth;
    e.currentTarget.classList.add('pulse');
    openEditor(null);
  });
  document.getElementById('closeEditor').addEventListener('click', saveDraftAndClose);
  document.getElementById('editorBackdrop').addEventListener('click', (e) => { if (e.target.id==='editorBackdrop') saveDraftAndClose(); });
  document.getElementById('pinBtn').addEventListener('click', (e) => {
    state.draft.pinned = !state.draft.pinned;
    e.currentTarget.classList.toggle('pinned', state.draft.pinned);
    e.currentTarget.classList.remove('pop'); void e.currentTarget.offsetWidth; e.currentTarget.classList.add('pop');
  });
  document.getElementById('deleteBtn').addEventListener('click', deleteDraft);
  document.getElementById('dupBtn').addEventListener('click', duplicateDraft);

  document.getElementById('closeCatEditor').addEventListener('click', () => closeSheet('catEditorBackdrop'));
  document.getElementById('catEditorBackdrop').addEventListener('click', (e) => { if (e.target.id==='catEditorBackdrop') closeSheet('catEditorBackdrop'); });
  document.getElementById('addCatBtn').addEventListener('click', addCategory);

  document.getElementById('closeSpaceEditor').addEventListener('click', () => closeSheet('spaceEditorBackdrop'));
  document.getElementById('spaceEditorBackdrop').addEventListener('click', (e) => { if (e.target.id==='spaceEditorBackdrop') closeSheet('spaceEditorBackdrop'); });
  document.getElementById('addSpaceBtn').addEventListener('click', addSpace);

  document.getElementById('searchInput').addEventListener('input', (e) => {
    state.query = e.target.value;
    renderList();
  });
  document.getElementById('globalSearchBtn').addEventListener('click', () => {
    state.globalSearch = !state.globalSearch;
    renderAll();
  });
  document.getElementById('sortBtn').addEventListener('click', cycleSort);

  document.getElementById('selectCancelBtn').addEventListener('click', exitSelectMode);
  document.getElementById('selectPinBtn').addEventListener('click', () => {
    const ids = [...state.selectedIds];
    const allPinned = ids.every(id => { const m = data.memos.find(x=>x.id===id); return m && m.pinned; });
    ids.forEach(id => { const m = data.memos.find(x=>x.id===id); if (m) m.pinned = !allPinned; });
    save();
    showToast(allPinned ? 'ピン留めを解除しました' : 'ピン留めしました');
    exitSelectMode();
  });
  document.getElementById('selectDeleteBtn').addEventListener('click', () => {
    const ids = [...state.selectedIds];
    showConfirm(`選択した${ids.length}件のメモを削除しますか？この操作は取り消せません。`, '削除', () => {
      data.memos = data.memos.filter(m => !ids.includes(m.id));
      save();
      showToast(ids.length + '件削除しました');
      exitSelectMode();
    });
  });

  load();
  applyTheme(computeEffectiveThemeId());
  applyAccent(data.accent);
  document.getElementById('sortLabel').textContent = '並び順: ' + SORT_LABELS[state.sortMode];
  renderAll();
})();
</script>
</body>
</html>
